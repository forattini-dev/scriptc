name: Native Rust compiler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compiler-rust:
    name: native compiler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Install pinned Rust toolchain
        working-directory: packages/compiler-rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/compiler-rust/target
          key: compiler-rust-${{ runner.os }}-${{ hashFiles('packages/compiler-rust/Cargo.lock', 'packages/compiler-rust/rust-toolchain.toml') }}
      - name: Format
        working-directory: packages/compiler-rust
        run: cargo fmt --check
      - name: Native and differential tests
        working-directory: packages/compiler-rust
        run: cargo test --locked -- --test-threads=1
      - name: Clippy
        working-directory: packages/compiler-rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install test-only IR oracle dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Existing IR validator and backend accept native compiler output
        run: pnpm test:compiler-rust:ir
