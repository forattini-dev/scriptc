[package]
name = "scriptc-runtime"
version = "0.0.35"
edition = "2024"
# Edition 2024 implies 1.85, but the runtime already uses `as_chunks` and
# `is_multiple_of` (both stable since 1.88), so 1.88 is the real floor and
# `clippy::incompatible_msrv` enforces it. The crate's own gate runs on the
# exact toolchain pinned in rust-toolchain.toml.
rust-version = "1.88"
license = "Apache-2.0"
description = "Memory-safe Rust runtime for scriptc-generated programs"
publish = false

[lib]
name = "scriptc_runtime"
path = "src/lib.rs"

[features]
default = []
sqlite = ["dep:rusqlite"]
# The V8 island: the JIT engine behind the same island surface the boa
# lane serves, through the sibling crate packages/island-v8 (the only
# place the rusty_v8 scope API's `unsafe` lives). Mutually exclusive with
# island-eval (lib.rs checks).
island-v8 = ["dep:scriptc-island-v8"]
island-eval = ["dep:boa_engine", "boa_engine/intl_bundled", "boa_engine/temporal", "boa_engine/annex-b"]

[dependencies]
boa_engine = { version = "=0.22.0", default-features = false, optional = true }
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
getrandom = "=0.4.3"
regress = { version = "0.12.0", features = ["prohibit-unsafe", "utf16"] }
ring = "=0.17.14"
scriptc-island-v8 = { path = "island-v8", optional = true }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "serialize", "cache"], optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
signal-hook = { version = "=0.4.4", default-features = false }
url = "=2.5.0"
webpki-roots = "=1.0.9"

[target.'cfg(all(not(windows), not(target_os = "wasi")))'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "net", "process", "std", "termios"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
terminal_size = "=0.4.4"

[target.'cfg(any(windows, target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
getifaddrs = "=0.6.2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

[[example]]
name = "island_parse"
required-features = ["island-eval"]

[[example]]
name = "island_eval"
required-features = ["island-eval"]

[[example]]
name = "island_module"
required-features = ["island-eval"]

# boa 0.22.0 with one fix (vendor/boa_engine/PATCHES.md): the property
# inline cache paired the shape read after a getter with the slot recorded
# before it, so a getter that redefines its own property (zod's lazy
# `shape`) made every later read call the stored value. Pure Rust, no
# network: the vendored copy is the registry crate plus that guard.
[dev-dependencies]
# The island probes (examples/island_link.rs) read boa's AST directly.
boa_ast = "=0.22.0"
boa_parser = "=0.22.0"
boa_interner = "=0.22.0"

[patch.crates-io]
# Preserve file-path empty segments for Node-compatible relative URL resolution.
url = { path = "vendor/url" }
boa_engine = { path = "vendor/boa_engine" }
# boa_ast 0.22.0 with one fix (vendor/boa_ast/PATCHES.md): the scope
# analyzer skipped a class method's COMPUTED name, so function expressions
# inside it (TypeScript's private-field downlevel) had no analyzed scope
# and panicked the bytecompiler.
boa_ast = { path = "vendor/boa_ast" }
# boa_gc 0.22.0 with a collection policy for long-lived heaps
# (vendor/boa_gc/PATCHES.md): the first collection waits for 64 MB and
# each later threshold is twice the surviving heap.
boa_gc = { path = "vendor/boa_gc" }
# boa_parser 0.22.0 with an ASCII fast path in the lexer's identifier
# character tests (vendor/boa_parser/PATCHES.md).
boa_parser = { path = "vendor/boa_parser" }

[[example]]
name = "island_link"
required-features = ["island-eval"]
