[package]
name = "scriptc-runtime"
version = "0.0.35"
edition = "2024"
license = "Apache-2.0"
description = "Memory-safe Rust runtime for scriptc-generated programs"
publish = false

[lib]
name = "scriptc_runtime"
path = "src/lib.rs"

[dependencies]
regress = { version = "0.12.0", features = ["prohibit-unsafe", "utf16"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
