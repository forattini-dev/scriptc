[package]
name = "scriptc-compiler"
version = "0.1.1-rust.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "scriptc"
path = "src/main.rs"

[dependencies]
source_frontend = { package = "goport_core", git = "https://github.com/pingdotgg/ts-rust.git", rev = "780dc512d64f40afebffa6a7028207649fb7ed1c", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.8"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
